[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapy-prometheus-exporter"
version = "1.0.2"
description = "Scrapy extension to export stats to Prometheus"
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "rangertaha", email = "rangertaha@gmail.com" }]
keywords = ["scrapy", "prometheus", "metrics", "monitoring", "stats"]
classifiers = [
    "Framework :: Scrapy",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "prometheus-client>=0.17.0",
    "Scrapy>=2.11.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/rangertaha/scrapy-prometheus-exporter"
Repository = "https://github.com/rangertaha/scrapy-prometheus-exporter"

[tool.hatch.build.targets.wheel]
packages = ["scrapy_prometheus_exporter"]

[tool.ruff]
target-version = "py310"
